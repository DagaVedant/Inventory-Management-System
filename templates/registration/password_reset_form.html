{% extends "core/base.html" %}
{% block title %}Reset your password{% endblock %}

{% block content %}
<div style="max-width:24rem; margin:3rem auto;">
  <hgroup>
    <h1>Reset your password</h1>
    <p>Enter the address on your account and we'll send you a link.</p>
  </hgroup>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
  </form>

  <p class="muted"><small><a href="{% url 'login' %}">Back to log in</a></small></p>
</div>
{% endblock %}
