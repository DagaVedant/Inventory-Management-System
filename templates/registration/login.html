{% extends "core/base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<div style="max-width:22rem; margin:3rem auto;">
  <h1>Inventory System</h1>

  {% if form.errors %}
    <article>That username and password don't match.</article>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>

  <p>No account? <a href="{% url 'signup' %}">Create one</a>.</p>

  <p class="muted"><small>
    New here? <a href="{% url 'guide' %}">How it works</a>.
  </small></p>
</div>
{% endblock %}
