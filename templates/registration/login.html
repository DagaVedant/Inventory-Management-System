{% extends "core/base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<h1>Inventory System</h1>

{% if form.errors %}
  <p role="alert"><mark>That username and password don't match. Check both and try again.</mark></p>
{% endif %}

<form method="post">
  {% csrf_token %}
  <p><label>Username {{ form.username }}</label></p>
  <p><label>Password {{ form.password }}</label></p>
  <p><button type="submit">Log in</button></p>
</form>

<p>No account? <a href="{% url 'signup' %}">Create one</a>.</p>
<p><small>New here? <a href="{% url 'guide' %}">How it works</a>.</small></p>
{% endblock %}
