{% extends "core/base.html" %}
{% block title %}Create an account{% endblock %}

{% block content %}
<h1>Create an account</h1>

{% if signup_code_required %}
  <p><small>Signup needs an invite code.</small></p>
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <p><button type="submit">Create account</button></p>
</form>

<p><small>Already have one? <a href="{% url 'login' %}">Log in</a>.</small></p>
{% endblock %}
