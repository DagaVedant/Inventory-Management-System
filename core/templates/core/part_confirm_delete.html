{% extends "core/base.html" %}
{% block title %}Delete part{% endblock %}

{% block content %}
<h1>Delete {{ object.name }}?</h1>

<p>You own {{ object.qty_owned }}, and active projects are holding
   {{ object.compute_held }}.</p>


<form method="post">
  {% csrf_token %}
  <button type="submit" class="contrast">Delete</button>
  <a href="{% url 'part_list' %}" role="button" class="secondary">Cancel</a>
</form>
{% endblock %}
