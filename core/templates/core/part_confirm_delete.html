{% extends "core/base.html" %}
{% block title %}Delete part{% endblock %}

{% block content %}
<div class="narrow">

<div class="page-head">
  <hgroup>
    <h1>Delete {{ object.name }}?</h1>
    <p>You own {{ object.qty_owned }}, and active projects are holding
       {{ object.compute_held }}. Its history goes with it.</p>
  </hgroup>
</div>

<form method="post">
  {% csrf_token %}
  <div class="form-actions">
    <button type="submit" class="btn-danger">Delete permanently</button>
    <a href="{% url 'part_detail' object.pk %}" class="muted">Cancel</a>
  </div>
</form>

</div>
{% endblock %}
