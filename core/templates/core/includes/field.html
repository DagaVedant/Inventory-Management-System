{% if field.field.widget.input_type == "checkbox" %}
<label class="check" for="{{ field.id_for_label }}">
  {{ field }}
  {{ field.label }}
</label>
{% else %}
<label for="{{ field.id_for_label }}">
  {{ field.label }}
  {{ field }}
</label>
{% endif %}
{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
{% if field.help_text %}<small class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
