{% extends "core/base.html" %}
{% block title %}Tags{% endblock %}

{% block content %}
<div style="max-width:44rem">

<hgroup>
  <h1>Tags</h1>
  <p>{{ tags|length }} in use.</p>
</hgroup>

<figure>
<table>
  <thead>
    <tr>
      <th scope="col">Tag</th>
      <th scope="col" class="num">Parts</th>
    </tr>
  </thead>
  <tbody>
    {% for tag, count in tags %}
    <tr>
      <th scope="row"><a href="{% url 'part_list' %}?tag={{ tag|urlencode }}">{{ tag }}</a></th>
      <td class="num">{{ count }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="2" class="muted">No tags yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
</figure>

{% if tags %}
<h2>Rename or remove</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Apply</button>
</form>
{% endif %}

<p><a href="{% url 'part_list' %}" role="button" class="secondary outline">All parts</a></p>

</div>
{% endblock %}
