{% extends "core/base.html" %}
{% block title %}Projects{% endblock %}

{% block content %}
<h1>Projects</h1>

<p><a href="{% url 'project_create' %}" role="button">New project</a></p>

<h2>Active</h2>
<figure>
<table>
  <thead>
    <tr>
      <th scope="col">Name</th>
      <th scope="col" class="num">Parts</th>
      <th scope="col">Started</th>
      <th scope="col"></th>
    </tr>
  </thead>
  <tbody>
    {% for project in active %}
    <tr>
      <th scope="row"><a href="{% url 'project_detail' project.pk %}">{{ project.name }}</a></th>
      <td class="num">{{ project.n_lines }}</td>
      <td class="muted">{{ project.created_at|date:"j M Y" }}</td>
      <td style="white-space:nowrap">
        {% if project.n_lines %}
          <a href="{% url 'project_teardown' project.pk %}" role="button"
             class="secondary btn-sm">Tear down</a>
        {% endif %}
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="muted">Nothing on the bench.</td></tr>
    {% endfor %}
  </tbody>
</table>
</figure>

<h2>Torn down</h2>
<figure>
<table>
  <thead>
    <tr>
      <th scope="col">Name</th>
      <th scope="col" class="num">Parts</th>
      <th scope="col">Torn down</th>
      <th scope="col"></th>
    </tr>
  </thead>
  <tbody>
    {% for project in archived %}
    <tr>
      <th scope="row"><a href="{% url 'project_detail' project.pk %}">{{ project.name }}</a></th>
      <td class="num">{{ project.n_lines }}</td>
      <td class="muted">{{ project.archived_at|date:"j M Y" }}</td>
      <td style="white-space:nowrap">
        <a href="{% url 'project_reopen' project.pk %}" role="button"
           class="secondary outline btn-sm">Reopen</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="muted">Nothing torn down yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
</figure>
{% endblock %}
