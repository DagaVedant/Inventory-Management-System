{% extends "core/base.html" %}
{% block title %}Projects{% endblock %}

{% block content %}
<div class="page-head">
  <hgroup>
    <h1>Projects</h1>
    <p>{{ active|length }} on the bench · {{ archived|length }} torn down</p>
  </hgroup>
  <div class="page-actions">
    <a href="{% url 'project_create' %}" role="button">New project</a>
  </div>
</div>

<div class="section-head">
  <h2>On the bench</h2>
  <p>Holding parts right now.</p>
</div>
<figure class="fit">
<table>
  <thead>
    <tr>
      <th scope="col">Name</th>
      <th scope="col" class="num">Parts</th>
      <th scope="col">Started</th>
      <th scope="col"></th>
    </tr>
  </thead>
  <tbody>
    {% for project in active %}
    <tr>
      <th scope="row"><a href="{% url 'project_detail' project.pk %}">{{ project.name }}</a></th>
      <td class="num">{{ project.n_lines }}</td>
      <td class="muted">{{ project.created_at|date:"j M Y" }}</td>
      <td class="num">
        {% if project.n_lines %}
          <a href="{% url 'project_teardown' project.pk %}" role="button"
             class="secondary outline btn-sm">Tear down</a>
        {% endif %}
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="muted">Nothing on the bench.
        <a href="{% url 'project_create' %}">Start a project</a>.</td></tr>
    {% endfor %}
  </tbody>
</table>
</figure>

<div class="section-head">
  <h2>Torn down</h2>
  <p>Finished builds. Reopen one to undo its teardown.</p>
</div>
<figure class="fit">
<table>
  <thead>
    <tr>
      <th scope="col">Name</th>
      <th scope="col" class="num">Parts</th>
      <th scope="col">Torn down</th>
      <th scope="col"></th>
    </tr>
  </thead>
  <tbody>
    {% for project in archived %}
    <tr>
      <th scope="row"><a href="{% url 'project_detail' project.pk %}">{{ project.name }}</a></th>
      <td class="num">{{ project.n_lines }}</td>
      <td class="muted">{{ project.archived_at|date:"j M Y" }}</td>
      <td class="num">
        <a href="{% url 'project_reopen' project.pk %}" role="button"
           class="secondary outline btn-sm">Reopen</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="muted">Nothing torn down yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
</figure>
{% endblock %}
