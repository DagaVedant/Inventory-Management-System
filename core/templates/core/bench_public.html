{% extends "core/base.html" %}
{% block title %}{{ bench.user.username }}'s bench{% endblock %}

{% block content %}
<hgroup>
  <h1>{{ bench.user.username }}'s bench</h1>
  <p>On the <a href="{% url 'roster' %}">roster</a> by choice.</p>
</hgroup>

{% if not user.is_authenticated %}
  <p><a href="{% url 'login' %}" role="button" class="secondary">Log in</a></p>
{% endif %}

{% include "core/includes/bench_card.html" %}
{% endblock %}
