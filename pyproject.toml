[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "DJ", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core"]

[tool.ruff.lint.per-file-ignores]
"core/management/commands/seed_demo.py" = ["E501"]
